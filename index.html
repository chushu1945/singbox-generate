<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singbox 配置生成器 - Nord 主题</title>
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <!-- Font Awesome via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(76, 86, 106, 0.5); border-radius: 20px; border: transparent; } /* polar-night-4 */
        .dark ::-webkit-scrollbar-thumb { background-color: rgba(216, 222, 233, 0.5); } /* snow-storm-1 */

        /* Fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }

        /* Nord-themed JSON Syntax Highlighting */
        /* Light Mode */
        .json-key { color: #5e81ac; }    /* Frost Dark Blue */
        .json-string { color: #d08770; } /* Aurora Orange */
        .json-number { color: #a3be8c; } /* Aurora Green */
        .json-boolean { color: #b48ead; }/* Aurora Purple */
        .json-null { color: #b48ead; }   /* Aurora Purple */
        /* Dark Mode */
        .dark .json-key { color: #88c0d0; }    /* Frost Light Blue */
        .dark .json-string { color: #d08770; } /* Aurora Orange */
        .dark .json-number { color: #a3be8c; } /* Aurora Green */
        .dark .json-boolean { color: #b48ead; }/* Aurora Purple */
        .dark .json-null { color: #b48ead; }   /* Aurora Purple */

        pre { white-space: pre-wrap; word-wrap: break-word; }

        /* Modal specific styles */
        .modal-overlay { background-color: rgba(0, 0, 0, 0.7); }
        .dark .modal-overlay { background-color: rgba(0, 0, 0, 0.8); }

        /* Custom colors for dynamic use in JS (for QR code) */
         /* Define base colors first */
        :root {
            --polar-night-1: #2e3440; /* Darkest Nord */
            --polar-night-2: #3b4252; /* Darker Nord */
            --snow-storm-3: #eceff4; /* Lightest Nord */

            /* QR code colors - always dark dots on light background for reliable rendering */
            --qrcode-dark: var(--polar-night-1);   /* Dots color (Dark Nord) */
            --qrcode-light: var(--snow-storm-3);  /* Background color (Light Nord) */
        }
         /* Removed the override for dark mode QR colors */
         /* .dark:root { ... } */


    </style>
    <script>
        // --- Tailwind Configuration ---
        tailwind.config = {
            darkMode: 'class', // Enable class strategy
            theme: {
                extend: {
                    colors: {
                        // Nord Palette Definition (also referenced by --var above)
                        // Polar Night (Dark Backgrounds/Text)
                        'polar-night-1': '#2e3440', // Darkest
                        'polar-night-2': '#3b4252',
                        'polar-night-3': '#434c5e',
                        'polar-night-4': '#4c566a', // Lightest Dark
                        // Snow Storm (Light Backgrounds/Text)
                        'snow-storm-1': '#d8dee9', // Darkest Light
                        'snow-storm-2': '#e5e9f0',
                        'snow-storm-3': '#eceff4', // Lightest
                        // Frost (Accents)
                        'frost-1': '#8fbcbb', // Teal
                        'frost-2': '#88c0d0', // Light Blue
                        'frost-3': '#81a1c1', // Medium Blue
                        'frost-4': '#5e81ac', // Dark Blue
                        // Aurora (Specific Accents)
                        'aurora-red': '#bf616a',
                        'aurora-orange': '#d08770',
                        'aurora-yellow': '#ebcb8b',
                        'aurora-green': '#a3be8c',
                        'aurora-purple': '#b48ead',
                    }
                }
            }
        }

        // --- Dark Mode Initial Setup ---
        // On page load or when changing themes, best to add inline to avoid flashing
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-snow-storm-3 dark:bg-polar-night-1 text-polar-night-1 dark:text-snow-storm-3 font-sans transition-colors duration-300 ease-in-out">

    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-10 bg-snow-storm-2/90 dark:bg-polar-night-2/90 backdrop-blur-sm shadow-sm border-b border-snow-storm-1/50 dark:border-polar-night-4/50">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-polar-night-1 dark:text-snow-storm-3">Singbox 配置生成器</h1>
                <button id="theme-toggle" type="button" class="text-polar-night-4 dark:text-snow-storm-1 hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 focus:outline-none focus:ring-4 focus:ring-frost-3/50 dark:focus:ring-frost-2/50 rounded-lg text-sm p-2.5 transition duration-150 ease-in-out">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </header>

        <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col lg:flex-row gap-8">

                <!-- Left Column: Configuration -->
                <div class="lg:w-1/2 space-y-6 fade-in">
                    <section class="bg-snow-storm-2 dark:bg-polar-night-2 rounded-lg shadow-md p-6 transition duration-150 ease-in-out hover:shadow-lg dark:hover:border dark:border-transparent dark:hover:border-frost-2/30">
                        <h2 class="text-lg font-semibold mb-4 border-b border-snow-storm-1 dark:border-polar-night-4 pb-2 text-polar-night-1 dark:text-snow-storm-3">1. 选择协议</h2>
                        <div id="protocol-selector" class="flex flex-wrap gap-4">
                            <label class="flex items-center space-x-2 cursor-pointer p-2 rounded hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 transition duration-150 ease-in-out">
                                <input type="radio" name="protocol" value="hysteria2" class="form-radio text-frost-4 dark:text-frost-2 focus:ring-frost-4 dark:focus:ring-frost-2 focus:ring-offset-snow-storm-2 dark:focus:ring-offset-polar-night-2" checked>
                                <span class="text-sm font-medium text-polar-night-2 dark:text-snow-storm-1">Hysteria2</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer p-2 rounded hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 transition duration-150 ease-in-out">
                                <input type="radio" name="protocol" value="tuic" class="form-radio text-frost-4 dark:text-frost-2 focus:ring-frost-4 dark:focus:ring-frost-2 focus:ring-offset-snow-storm-2 dark:focus:ring-offset-polar-night-2">
                                <span class="text-sm font-medium text-polar-night-2 dark:text-snow-storm-1">TUIC v5</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer p-2 rounded hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 transition duration-150 ease-in-out">
                                <input type="radio" name="protocol" value="anytls" class="form-radio text-frost-4 dark:text-frost-2 focus:ring-frost-4 dark:focus:ring-frost-2 focus:ring-offset-snow-storm-2 dark:focus:ring-offset-polar-night-2">
                                <span class="text-sm font-medium text-polar-night-2 dark:text-snow-storm-1">AnyTLS</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer p-2 rounded hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 transition duration-150 ease-in-out">
                                <input type="radio" name="protocol" value="vless-reality" class="form-radio text-frost-4 dark:text-frost-2 focus:ring-frost-4 dark:focus:ring-frost-2 focus:ring-offset-snow-storm-2 dark:focus:ring-offset-polar-night-2">
                                <span class="text-sm font-medium text-polar-night-2 dark:text-snow-storm-1">VLESS Reality</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer p-2 rounded hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 transition duration-150 ease-in-out">
                                <input type="radio" name="protocol" value="trojan" class="form-radio text-frost-4 dark:text-frost-2 focus:ring-frost-4 dark:focus:ring-frost-2 focus:ring-offset-snow-storm-2 dark:focus:ring-offset-polar-night-2">
                                <span class="text-sm font-medium text-polar-night-2 dark:text-snow-storm-1">Trojan</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer p-2 rounded hover:bg-snow-storm-1 dark:hover:bg-polar-night-3 transition duration-150 ease-in-out">
                                <input type="radio" name="protocol" value="vmess" class="form-radio text-frost-4 dark:text-frost-2 focus:ring-frost-4 dark:focus:ring-frost-2 focus:ring-offset-snow-storm-2 dark:focus:ring-offset-polar-night-2">
                                <span class="text-sm font-medium text-polar-night-2 dark:text-snow-storm-1">VMess</span>
                            </label>
                        </div>
                    </section>

                    <section class="bg-snow-storm-2 dark:bg-polar-night-2 rounded-lg shadow-md p-6 transition duration-150 ease-in-out hover:shadow-lg dark:hover:border dark:border-transparent dark:hover:border-frost-2/30">
                        <h2 class="text-lg font-semibold mb-4 border-b border-snow-storm-1 dark:border-polar-night-4 pb-2 text-polar-night-1 dark:text-snow-storm-3">2. 填写配置</h2>
                        <form id="config-form" class="space-y-4">
                            <div>
                                <label for="listen_port" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">监听端口</label>
                                <input type="number" id="listen_port" name="listen_port" value="443" required class="mt-1 block w-full rounded-md border-snow-storm-1 dark:border-polar-night-4 shadow-sm focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="例如: 443">
                            </div>

                            <!-- Protocol Specific Fields -->
                            <div id="hysteria2-fields" class="space-y-4">

                                    <label for="hy2_up_mbps" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">上行速度 (Mbps)</label>

                                </div>
                                <div>
                                    <label for="hy2_down_mbps" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">下行速度 (Mbps)</label>
                                    <input type="number" id="hy2_down_mbps" name="hy2_down_mbps" value="200" required class="mt-1 block w-full rounded-md border-snow-storm-1 dark:border-polar-night-4 shadow-sm focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="例如: 200">
                                </div>
                                <div>
                                    <label for="hy2_password" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">密码 (留空则自动生成 UUID)</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <input type="text" id="hy2_password" name="hy2_password" class="block w-full pr-10 rounded-md border-snow-storm-1 dark:border-polar-night-4 focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="自动生成 UUID">
                                        <button type="button" id="generate-hy2-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-frost-4 hover:text-frost-3 dark:text-frost-2 dark:hover:text-frost-1 transition duration-150 ease-in-out" title="生成随机 UUID">
                                            <i class="fas fa-dice"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div id="tuic-fields" class="space-y-4 hidden">
                                <div>
                                    <label for="tuic_uuid" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">用户 UUID (留空则自动生成)</label>
                                     <div class="mt-1 relative rounded-md shadow-sm">
                                        <input type="text" id="tuic_uuid" name="tuic_uuid" class="block w-full pr-10 rounded-md border-snow-storm-1 dark:border-polar-night-4 focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="自动生成 UUID">
                                        <button type="button" id="generate-tuic-uuid" class="absolute inset-y-0 right-0 pr-3 flex items-center text-frost-4 hover:text-frost-3 dark:text-frost-2 dark:hover:text-frost-1 transition duration-150 ease-in-out" title="生成随机 UUID">
                                            <i class="fas fa-dice"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label for="tuic_password" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">密码 (留空则自动生成 UUID)</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <input type="text" id="tuic_password" name="tuic_password" class="block w-full pr-10 rounded-md border-snow-storm-1 dark:border-polar-night-4 focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="自动生成 UUID">
                                         <button type="button" id="generate-tuic-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-frost-4 hover:text-frost-3 dark:text-frost-2 dark:hover:text-frost-1 transition duration-150 ease-in-out" title="生成随机 UUID">
                                            <i class="fas fa-dice"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div id="anytls-fields" class="space-y-4 hidden">
                                <div>
                                    <label for="anytls_server_name" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">服务器名称 (peer)</label>
                                    <input type="text" id="anytls_server_name" name="anytls_server_name" required class="mt-1 block w-full rounded-md border-snow-storm-1 dark:border-polar-night-4 shadow-sm focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="例如: yourdomain.com">
                                </div>
                                <div>
                                    <label for="anytls_password" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">密码 (留空则自动生成 UUID)</label>
                                     <div class="mt-1 relative rounded-md shadow-sm">
                                        <input type="text" id="anytls_password" name="anytls_password" class="block w-full pr-10 rounded-md border-snow-storm-1 dark:border-polar-night-4 focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="自动生成 UUID">

                                        </button>

                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <input type="text" id="vless_uuid" name="vless_uuid" class="block w-full pr-10 rounded-md border-snow-storm-1 dark:border-polar-night-4 focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="自动生成 UUID">
                                        <button type="button" id="generate-vless-uuid" class="absolute inset-y-0 right-0 pr-3 flex items-center text-frost-4 hover:text-frost-3 dark:text-frost-2 dark:hover:text-frost-1 transition duration-150 ease-in-out" title="生成随机 UUID">
                                            <i class="fas fa-dice"></i>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label for="vless_server_name" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">服务器名称 (SNI/目标服务器)</label>
                                    <select id="vless_server_name" name="vless_server_name" class="mt-1 block w-full rounded-md border-snow-storm-1 dark:border-polar-night-4 shadow-sm focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out">

                                </div>
                                <div>
                                    <label for="vless_private_key" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">Reality 私钥 (sing-box generate reality-keypair)</label>
                                    <div class="mt-1 relative rounded-md shadow-sm">
                                        <input type="text" id="vless_private_key" name="vless_private_key" class="block w-full pr-10 rounded-md border-snow-storm-1 dark:border-polar-night-4 focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="输入您的 Reality 私钥">
                                         <!-- Note: Cannot reliably generate keypair in JS -->
                                    </div>
                                </div>
                                <!-- New field for Public Key needed for export link -->
                                <div id="vless-public-key-field" class="space-y-4 hidden"> <!-- Added space-y-4 here for consistency -->
                                    <label for="vless_public_key" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">Reality 公钥 (用于导出链接)</label>
                                    <input type="text" id="vless_public_key" name="vless_public_key" class="mt-1 block w-full rounded-md border-snow-storm-1 dark:border-polar-night-4 shadow-sm focus:border-frost-4 dark:focus:border-frost-2 focus:ring focus:ring-frost-4/50 dark:focus:ring-frost-2/50 focus:ring-opacity-50 bg-snow-storm-3 dark:bg-polar-night-3 text-polar-night-1 dark:text-snow-storm-3 transition duration-150 ease-in-out" placeholder="输入与私钥对应的公钥">
                                </div>
                                <div>
                                    <label for="vless_short_id" class="block text-sm font-medium text-polar-night-2 dark:text-snow-storm-1 mb-1">Short ID (sing-box generate rand 8 --hex)</label>

        // --- UTILITY FUNCTIONS ---
        function generateUUID() {
            var d = new Date().getTime();
            var d2 = ((typeof performance !== 'undefined') && performance.now && (performance.now()*1000)) || 0;
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16;
                if(d > 0){
                    r = (d + r)%16 | 0;
                    d = Math.floor(d/16);
                } else {
                    r = (d2 + r)%16 | 0;
                    d2 = Math.floor(d2/16);
                }
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        // Generates an alphanumeric password (for Trojan)
        function generateAlphanumericPassword(length = 16) {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let password = "";
            for (let i = 0; i < length; ++i) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            return password;
        }

         // Generates a hex string (for VLESS Reality Short ID)
        function generateHexString(length = 8) {
            const charset = "0123456789abcdef";
            let hexString = "";
            for (let i = 0; i < length; ++i) {
                hexString += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            return hexString;
        }


        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                 json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number'; // Default class
                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'json-key' : 'json-string';
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function generateConfig() {
            const selectedProtocol = document.querySelector('input[name="protocol"]:checked').value;
            const port = parseInt(listenPortInput.value) || 443;
            const certPath = certPathInput.value || '/home/ssl/public.pem';
            const keyPath = keyPathInput.value || '/home/ssl/private.key';
            let config = {};

            try {
                if (selectedProtocol === 'hysteria2') {
                    const upMbps = parseInt(document.getElementById('hy2_up_mbps').value) || 50;
                    const downMbps = parseInt(document.getElementById('hy2_down_mbps').value) || 200;
                    // Get value directly from the input field (which is now auto-filled)
                    const password = hy2PasswordInput.value;
                    if (!password) throw new Error("Hysteria2 密码不能为空"); // Ensure it's not empty
                    config = { inbounds: [ { type: "hysteria2", listen: "::", listen_port: port, up_mbps: upMbps, down_mbps: downMbps, users: [ { password: password } ], tls: { enabled: true, alpn: ["h3"], certificate_path: certPath, key_path: keyPath } } ] };
                } else if (selectedProtocol === 'tuic') {
                    // Get values directly from the input fields (which are now auto-filled)
                    const uuid = tuicUuidInput.value;
                    const password = tuicPasswordInput.value;
                    if (!uuid || !password) throw new Error("TUIC UUID 或密码不能为空"); // Ensure they are not empty
                    config = { inbounds: [ { type: "tuic", listen: "::", listen_port: port, users: [ { uuid: uuid, password: password } ], congestion_control: "bbr", tls: { enabled: true, alpn: ["h3"], certificate_path: certPath, key_path: keyPath } } ] };
                } else if (selectedProtocol === 'anytls') {
                    // Get values directly from the input fields (password is now auto-filled)
                    const password = anytlsPasswordInput.value;
                    const serverName = anytlsServerNameInput.value.trim();
                    if (!password || !serverName) throw new Error("AnyTLS 密码或服务器名称不能为空"); // Ensure they are not empty
                    config = { inbounds: [ { type: "anytls", listen: "::", listen_port: port, users: [ { password: password } ], tls: { enabled: true, server_name: serverName, certificate_path: certPath, key_path: keyPath } } ] };
                } else if (selectedProtocol === 'vless-reality') {
                    // Get values directly from the input fields (UUID and Short ID are now auto-filled)
                    const uuid = vlessUuidInput.value;
                    const serverName = vlessServerNameInput.value || 'www.icloud.com';
                    const privateKey = vlessPrivateKeyInput.value.trim(); // Don't auto-generate private key
                    const shortId = vlessShortIdInput.value.trim(); // Get Short ID directly from input

                    // Basic validation for Reality fields needed for config
                    if (!uuid || !privateKey || !shortId) { // UUID and Short ID are now required for config
                         const missing = [];
                         if (!uuid) missing.push("用户 UUID");
                         if (!privateKey) missing.push("Reality 私钥");
                         if (!shortId) missing.push("Short ID");
                         throw new Error(`VLESS Reality 缺少必要信息: ${missing.join(', ')}`);
                    }

                    config = {
                        inbounds: [{
                            type: "vless",
                            listen: "::",
                            listen_port: port,
                            users: [{ uuid: uuid, flow: "xtls-rprx-vision" }],
                            tls: {
                                enabled: true,
                                server_name: serverName, // SNI
                                reality: {
                                    enabled: true,
                                    handshake: {
                                        server: serverName, // Target server for handshake
                                        server_port: 443 // Target server port for handshake
                                    },
                                    private_key: privateKey,
                                    short_id: [shortId] // Use the value from the input field
                                }
                            }
                        }]
                    };
                } else if (selectedProtocol === 'trojan') {
                    // Get value directly from the input field (which is now auto-filled)
                    const password = trojanPasswordInput.value;
                    if (!password) throw new Error("Trojan 密码不能为空"); // Ensure it's not empty
                    config = {
                        inbounds: [{
                            type: "trojan",
                            listen: "::",
                            listen_port: port,
                            users: [{ password: password }],
                            tls: {
                                enabled: true,
                                certificate_path: certPath,
                                key_path: keyPath
                            },
                            multiplex: {
                                enabled: true
                            }
                        }]
                    };
                } else if (selectedProtocol === 'vmess') {
                    // Get value directly from the input field (UUID is now auto-filled)
                    const uuid = vmessUuidInput.value;
                    const serverName = vmessServerNameInput.value.trim(); // SNI/Host
                    const path = vmessPathInput.value || '/ws'; // Has default value
                    if (!uuid || !serverName) throw new Error("VMess UUID 或服务器名称(SNI/Host)不能为空"); // Ensure required fields are not empty


                    // VMess config uses the values directly
                    config = {
                        inbounds: [{
                            type: "vmess",
                            listen: "::",
                            listen_port: port,
                            users: [{ uuid: uuid, alterId: 0 }],
                            tag: "vmess-inbound",
                            transport: {
                                type: "ws",
                                path: path
                            },
                            tls: {
                                enabled: true, // Assuming TLS for VMess WS export link
                                server_name: serverName, // SNI for WebSocket+TLS
                                certificate_path: certPath,
                                key_path: keyPath
                            }
                        }]
                    };
                }

                // Check required TLS paths unless it's Reality
                if (selectedProtocol !== 'vless-reality') {
                     if (!certPath) throw new Error("证书路径不能为空");
                     if (!keyPath) throw new Error("私钥路径不能为空");
                }


                currentConfig = config;
                // console.log('Generated Config:', currentConfig); // Debugging log
                jsonOutput.innerHTML = syntaxHighlight(currentConfig);
                // console.log('Set JSON output HTML'); // Debugging log
                jsonOutput.classList.remove('text-aurora-red'); // Clear previous error styling
                jsonOutput.parentElement.classList.remove('bg-aurora-red/20');
                 exportButton.disabled = false; // Enable export button
            } catch (error) {
                console.error("Error generating config:", error);
                currentConfig = {}; // Clear invalid config
                jsonOutput.textContent = `配置生成错误: ${error.message}`;
                jsonOutput.classList.add('text-aurora-red'); // Use Aurora Red for errors
                 jsonOutput.parentElement.classList.add('bg-aurora-red/20'); // Add error background
                 exportButton.disabled = true; // Disable export on error
            }
            return currentConfig;
        }

        // --- EXPORT MODAL LOGIC ---

         // Function to generate the QR code from a given text
         function generateQrCode(text) {
              // console.log("Attempting to generate QR code for:", text);
              // Clear previous QR code first
              if (qrcodeInstance) {
                   // console.log("Clearing existing QR code instance.");
                   try { qrcodeInstance.clear(); } catch(e) { console.warn("Error clearing qrcode instance:", e); }
               }
              exportQrcodeContainer.innerHTML = ''; // Clear the DOM element content
              qrcodeInstance = null; // Reset instance variable
              // console.log("Container cleared.");

              if (!text || text.includes("请先输入") || text.includes("暂未支持") || text.trim() === "") { // Handle placeholder/error texts and empty string
                  // console.log("Invalid or empty text for QR code:", text);
                  qrcodeError.classList.remove('hidden');
                  qrcodeError.textContent = text.trim() === "" ? "连接字符串为空" : text;
                  return;
              }

              try {
                   // Get colors from CSS variables defined in :root
                   // These are now fixed to dark-on-light regardless of theme
                   const htmlElement = document.documentElement;
                   const computedStyle = getComputedStyle(htmlElement);

                   const foreColor = computedStyle.getPropertyValue('--qrcode-dark').trim() || '#2e3440';
                   const backColor = computedStyle.getPropertyValue('--qrcode-light').trim() || '#eceff4';

                  // console.log('Using Foreground Color:', foreColor, 'Using Background Color:', backColor);

                   // Adjusted size to match the w-48 h-48 Tailwind class (192px) for better layout
                  qrcodeInstance = new QRCode(exportQrcodeContainer, {
                      text: text,
                      width: 192, // Adjusted from 176 to 192
                      height: 192, // Adjusted from 176 to 192
                       // Adjust colors based on theme - NOW FIXED TO DARK-ON-LIGHT
                      colorDark : foreColor, // Foreground color (should be dark)
                      colorLight : backColor, // Background color (should be light)
                      correctLevel : QRCode.CorrectLevel.H // Higher correction level
                  });
                   // console.log('QR code instance created.');

                  // Check if QR code element was actually created inside the container
                  if (exportQrcodeContainer.children.length === 0) {
                       console.error("QR code library did not create an element inside the container.");
                       throw new Error("QR code element not created.");
                   }

                  qrcodeError.classList.add('hidden'); // Hide error if successful
                  // console.log('QR code generated successfully.');
              } catch (e) {
                  console.error("Error generating QR code:", e); // Log the error details
                   // Ensure cleanup on error
                   if (qrcodeInstance) {
                       try { qrcodeInstance.clear(); } catch(ce) { console.warn("Error clearing qrcode instance on error:", ce); }
                   }
                    exportQrcodeContainer.innerHTML = '';
                    qrcodeInstance = null;

                  qrcodeError.classList.remove('hidden');
                  qrcodeError.textContent = `生成二维码失败: ${e.message || e}`; // Show basic error message
              }
         }

        // Function to generate the standard export link based on current config and modal inputs
        function generateExportLink() {
             const selectedProtocol = document.querySelector('input[name="protocol"]:checked').value;
             const domainIp = exportDomainIpInput.value.trim();
             const port = listenPortInput.value; // Get port from main form
             const remark = nodeRemarkInput.value.trim() || `Singbox_${selectedProtocol}_${port}`; // Get remark from main form, default if empty
             const encodedRemark = encodeURIComponent(remark);


             if (!currentConfig || Object.keys(currentConfig).length === 0 || !currentConfig.inbounds || currentConfig.inbounds.length === 0) {
                 const msg = "无 Sing-box 配置数据，无法生成链接。";
                 exportLinkTextarea.value = msg;
                 generateQrCode(msg); // Pass error message to QR generator
                 return "";
             }

             const inbound = currentConfig.inbounds[0];
             let link = "";
             let errorMsg = "";


             // Check if domain/IP is provided for protocols that need it in the link
             const needsDomainIp = ['hysteria2', 'tuic', 'anytls', 'vless-reality', 'trojan', 'vmess'];
             if (needsDomainIp.includes(selectedProtocol) && !domainIp) {
                  errorMsg = "请先输入服务器域名或IP!";
             } else {
                 const encodedDomainIp = encodeURIComponent(domainIp); // Encode modal domain/IP

                 try {
                     if (selectedProtocol === 'hysteria2') {
                         const password = inbound.users[0]?.password;
                         if (!password) throw new Error("HY2 密码缺失"); // Should not happen with auto-fill
                          link = `hysteria2://${encodeURIComponent(password)}@${encodedDomainIp}:${port}?alpn=h3&insecure=1#${encodedRemark}`;

                     } else if (selectedProtocol === 'tuic') {
                         const uuid = inbound.users[0]?.uuid;
                         const password = inbound.users[0]?.password;
                         if (!uuid || !password) throw new Error("TUIC UUID 或密码缺失"); // Should not happen with auto-fill
                          // Use the port from the main form
                         link = `tuic://${encodeURIComponent(uuid)}:${encodeURIComponent(password)}@${encodedDomainIp}:${port}?alpn=h3&allow_insecure=1&congestion_control=bbr#${encodedRemark}`;

                     } else if (selectedProtocol === 'anytls') {
                         const password = inbound.users[0]?.password;
                         const peer = inbound.tls?.server_name; // peer in link comes from server_name in config
                         if (!password || !peer) throw new Error("AnyTLS 密码或服务器名称缺失"); // Should not happen with auto-fill/validation
                          // Use the port from the main form
                         link = `anytls://${encodeURIComponent(password)}@${encodedDomainIp}:${port}?peer=${encodeURIComponent(peer)}&udp=1#${encodedRemark}`;

                     } else if (selectedProtocol === 'vless-reality') {
                          const uuid = inbound.users[0]?.uuid;
                          const sni = inbound.tls?.server_name; // SNI comes from server_name in config
                          const publicKey = vlessPublicKeyInput.value.trim(); // Public key is from the separate input field
                          // Get Short ID directly from the input field (which is now auto-filled)
                          const shortId = vlessShortIdInput.value.trim();


                          if (!uuid || !sni || !publicKey || !shortId) {
                              const missing = [];
                              if (!uuid) missing.push("UUID");
                              if (!sni) missing.push("SNI");
                              if (!publicKey) missing.push("公钥 (用于导出)"); // Emphasize public key is needed for link
                              if (!shortId) missing.push("Short ID"); // Short ID is required *for the link*
                              throw new Error(`VLESS Reality 缺少必要信息: ${missing.join(', ')}`);
                          }

                          // Use the port from the main form
                          // Note: fp=chrome is common but not strictly required by Sing-box config, added to link as per user template
                          link = `vless://${encodeURIComponent(uuid)}@${encodedDomainIp}:${port}?encryption=none&security=reality&flow=xtls-rprx-vision&type=tcp&sni=${encodeURIComponent(sni)}&pbk=${encodeURIComponent(publicKey)}&sid=${encodeURIComponent(shortId)}&fp=chrome#${encodedRemark}`;


                     } else if (selectedProtocol === 'trojan') {
                         const password = inbound.users[0]?.password;
                         if (!password) throw new Error("Trojan 密码缺失"); // Should not happen with auto-fill
                         // Use the port from the main form
                         link = `trojan://${encodeURIComponent(password)}@${encodedDomainIp}:${port}?type=tcp&security=tls&allowInsecure=1#${encodedRemark}`;

                     } else if (selectedProtocol === 'vmess') {
                         const uuid = inbound.users[0]?.uuid;
                         const path = inbound.transport?.path || '/ws';
                         const serverName = inbound.tls?.server_name; // SNI/Host from config
                         // Note: VMess link JSON uses 'add', 'host', 'sni' fields.
                         // 'add' is the server address (from modal domain/IP)
                         // 'host' is the WS Host header (from config serverName)
                         // 'sni' is the TLS SNI (from config serverName)

                         if (!uuid || !serverName) throw new Error("VMess UUID 或服务器名称(SNI/Host)缺失"); // Should not happen with auto-fill/validation
                         // serverName might be optional for some VMess configs, but required for WS+TLS link often.
                         // If serverName is empty in config, use the modal domain/IP for host/sni in the link JSON.
                         const linkHost = serverName || domainIp; // Use config serverName if present, else modal domain/IP
                         const linkSni = serverName || domainIp; // Use config serverName if present, else modal domain/IP


                         const vmessLinkJson = {
                             v: "2",
                             ps: remark, // Use remark for 'ps' field in link JSON
                             add: domainIp, // Server address comes from the modal input
                             port: String(port), // Port from main form (as string)
                             id: uuid,
                             aid: "0", // AlterId is 0 in the config
                             scy: "auto", // Security crypto
                             net: "ws", // Network type
                             type: "", // Transport type (often empty for ws)
                             host: linkHost, // WS Host header
                             path: path, // WS path
                             tls: "tls", // TLS enabled
                             sni: linkSni, // TLS SNI
                             alpn: "", // Optional ALPN
                             fp: "" // Optional fingerprint
                         };

                         const vmessJsonString = JSON.stringify(vmessLinkJson);
                         // Base64 encode the JSON string
                         try {
                            link = `vmess://${btoa(vmessJsonString)}`;
                         } catch (e) {
                             throw new Error("Base64 编码失败: " + e.message);
                         }


                     } else {
                          errorMsg = `当前协议 (${selectedProtocol}) 暂不支持生成标准订阅链接。`;
                     }
                 } catch (e) {
                     console.error("Error generating export link:", e);
                     errorMsg = `生成链接错误: ${e.message}`;
                 }
             }


             if (errorMsg) {
                  exportLinkTextarea.value = errorMsg;
                  generateQrCode(errorMsg); // Pass error message to QR generator
                  return ""; // Return empty string on error
             } else {
                  exportLinkTextarea.value = link; // Set the generated link
                  generateQrCode(link); // Generate QR code from the generated link
                  return link; // Return the generated link
             }
        }


        function showExportModal() {
            // Ensure currentConfig is up-to-date before opening modal
            generateConfig();

            const selectedProtocol = document.querySelector('input[name="protocol"]:checked').value;

            // Clear previous state
             if (qrcodeInstance) {
                 qrcodeInstance.clear();
             }
            exportQrcodeContainer.innerHTML = '';
            qrcodeInstance = null; // Reset instance variable
            exportLinkTextarea.value = '';
            exportDomainIpInput.value = ''; // Clear domain/IP input in modal
            qrcodeError.classList.add('hidden');


            // Attempt to generate link for supported protocols immediately upon opening
            const supportedProtocols = ['hysteria2', 'tuic', 'anytls', 'vless-reality', 'trojan', 'vmess']; // Add all supported protocols here

            if (supportedProtocols.includes(selectedProtocol)) {
                 exportModal.classList.remove('hidden');
                 exportDomainIpInput.focus(); // Focus domain/IP input
                 // Prompt user to enter Domain/IP and generate link/QR
                 exportLinkTextarea.value = "请先输入服务器域名或IP!";
                 generateQrCode(''); // Clear/hide QR initially
                 qrcodeError.classList.remove('hidden');
                 qrcodeError.textContent = "请先输入服务器域名或IP!";
            } else {
                 // Protocol not supported for direct link export yet
                 alert(`当前协议 (${selectedProtocol}) 暂不支持生成标准订阅链接。`);
                 // Keep modal hidden and don't proceed
                 exportModal.classList.add('hidden');
                 return; // Exit function
            }
        }

        function hideExportModal() {
            exportModal.classList.add('hidden');
             // Clear content when closing
             if (qrcodeInstance) {
                 qrcodeInstance.clear();
             }
            exportQrcodeContainer.innerHTML = '';
            qrcodeInstance = null; // Reset instance variable

            exportLinkTextarea.value = '';
            exportDomainIpInput.value = '';
            qrcodeError.classList.add('hidden');
        }


        // --- EVENT LISTENERS ---
        protocolSelector.addEventListener('change', () => {
             updateFormVisibility();
             // After updating visibility and potentially auto-filling fields, generate config
             generateConfig();
        });
        // Listen for input changes on the form to regenerate config
        configForm.addEventListener('input', generateConfig);

        // Password/UUID generation buttons
        document.getElementById('generate-hy2-password').addEventListener('click', () => { hy2PasswordInput.value = generateUUID(); generateConfig(); });
        document.getElementById('generate-tuic-uuid').addEventListener('click', () => { tuicUuidInput.value = generateUUID(); generateConfig(); });
        document.getElementById('generate-tuic-password').addEventListener('click', () => { tuicPasswordInput.value = generateUUID(); generateConfig(); }); // TUIC password is now UUID
        document.getElementById('generate-anytls-password').addEventListener('click', () => { anytlsPasswordInput.value = generateUUID(); generateConfig(); });
        document.getElementById('generate-vless-uuid').addEventListener('click', () => { vlessUuidInput.value = generateUUID(); generateConfig(); });
         // Note: Cannot reliably generate keypair in JS. Short ID generation is hex.
        // document.getElementById('generate-vless-keypair').addEventListener('click', () => { /* Logic needed if implemented */ });

        // MODIFICATION: Generate Short ID and populate the input field ONLY when the button is clicked
        document.getElementById('generate-vless-short-id').addEventListener('click', () => {
            vlessShortIdInput.value = generateHexString(8).toLowerCase();
            generateConfig(); // Regenerate config after populating the field
        });

        document.getElementById('generate-trojan-password').addEventListener('click', () => { trojanPasswordInput.value = generateAlphanumericPassword(16); generateConfig(); }); // Trojan password is 16-char alphanumeric
        document.getElementById('generate-vmess-uuid').addEventListener('click', () => { vmessUuidInput.value = generateUUID(); generateConfig(); });


        // Copy JSON Button Listener
        copyButton.addEventListener('click', () => {
            const configText = JSON.stringify(currentConfig, null, 2);
            if (!configText || configText === '{}') { alert('没有可复制的配置。'); return; }
            navigator.clipboard.writeText(configText).then(() => {
                const originalHTML = copyButton.innerHTML;
                const originalClasses = copyButton.className;
                copyButton.innerHTML = '<i class="fas fa-check mr-1"></i> 已复制!';
                 // Temporarily change color to green
                 copyButton.className = originalClasses.replace(/bg-frost-\d+|hover:bg-frost-\d+|dark:bg-frost-\d+|dark:hover:bg-frost-\d+/g, '') + ' bg-aurora-green hover:bg-aurora-green/80 dark:bg-aurora-green dark:hover:bg-aurora-green/90 text-polar-night-1 dark:text-polar-night-1';
                setTimeout(() => {
                    copyButton.innerHTML = originalHTML;
                    copyButton.className = originalClasses; // Restore original classes
                }, 2000);
            }).catch(err => { console.error('无法复制文本: ', err); alert('复制失败! 请手动复制。'); });
        });

        // Download JSON Button Listener
        downloadButton.addEventListener('click', () => {
            const configToDownload = currentConfig;
            const configText = JSON.stringify(configToDownload, null, 2);
            if (!configText || configText === '{}') { alert('没有可下载的配置。'); return; }
            const selectedProtocol = document.querySelector('input[name="protocol"]:checked').value;
            const port = listenPortInput.value || 'port';
             // Changed filename format as requested: protocol-port.json
            const filename = `${selectedProtocol}-${port}.json`;
            const blob = new Blob([configText], { type: 'application/json;charset=utf-8;' });
            const link = document.createElement("a");
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url); // Clean up
            } else { alert('您的浏览器不支持自动下载。请手动复制配置。'); }
        });

        // --- Export Modal Event Listeners ---
        exportButton.addEventListener('click', showExportModal);
        closeModalButton.addEventListener('click', hideExportModal);
        // Close modal when clicking outside the content box
        exportModal.addEventListener('click', (e) => {
            if (e.target === exportModal) {
                hideExportModal();
            }
        });

        // Automatically generate link/QR when domain/IP input changes in modal
        exportDomainIpInput.addEventListener('input', generateExportLink);

        // Update QR code when "Update QR Code" button is clicked (uses current textarea content)
        updateExportQrcodeButton.addEventListener('click', () => {
            const linkToEncode = exportLinkTextarea.value;
             if (!linkToEncode || linkToEncode.includes("请先输入") || linkToEncode.includes("暂未支持") || linkToEncode.trim() === "") {
                 // Alert handled by generateQrCode when it receives invalid text
                 generateQrCode(linkToEncode); // Still call generateQrCode to update state and show error
                 return;
             }
            generateQrCode(linkToEncode); // Generate QR based on current textarea content
        });

         // Update QR code when the link textarea is edited
         exportLinkTextarea.addEventListener('input', () => {
             const linkToEncode = exportLinkTextarea.value;
             if (!linkToEncode || linkToEncode.includes("请先输入") || linkToEncode.includes("暂未支持") || linkToEncode.trim() === "") {
                 generateQrCode(linkToEncode); // Show error state for QR
                 return;
             }
             generateQrCode(linkToEncode); // Generate QR based on the new text
         });


         // Copy link from modal textarea
         copyExportLinkButton.addEventListener('click', () => {
             const linkText = exportLinkTextarea.value;
             if (!linkText || linkText.includes("请先输入") || linkText.includes("暂未支持") || linkText.trim() === "") {
                 alert("没有可复制的连接。");
                 return;
             }
             navigator.clipboard.writeText(linkText).then(() => {
                 const originalHTML = copyExportLinkButton.innerHTML; // Correct variable name
                 const originalClasses = copyExportLinkButton.className;
                 copyExportLinkButton.innerHTML = '<i class="fas fa-check mr-1"></i> 已复制!';
                  // Temporarily change color to green
                 copyExportLinkButton.className = originalClasses.replace(/bg-frost-\d+|hover:bg-frost-\d+|dark:bg-frost-\d+|dark:hover:bg-frost-\d+/g, '') + ' bg-aurora-green hover:bg-aurora-green/80 dark:bg-aurora-green dark:hover:bg-aurora-green/90 text-polar-night-1 dark:text-polar-night-1';
                 setTimeout(() => {
                     copyExportLinkButton.innerHTML = originalHTML;
                     copyExportLinkButton.className = originalClasses; // Restore original classes
                 }, 2000);
             }).catch(err => { console.error('无法复制文本: ', err); alert('复制失败! 请手动复制。'); });
         });


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            currentYearSpan.textContent = new Date().getFullYear();
            updateThemeIcons(); // Set initial theme icons
            // MODIFIED: Ensure initial visibility update also triggers UUID/Short ID generation if needed
            updateFormVisibility(); // Show fields for default selected protocol (Hysteria2 by default)
            // Generate initial config AFTER form visibility is updated
            generateConfig(); // Generate initial config on load
        });
    </script>
